<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebHub Showcase</title>
    <meta name="description" content="Nền tảng chia sẻ website và mô phỏng giáo dục trực tuyến với mã QR, chế độ xem rút gọn và phân loại mô phỏng nổi tiếng." />
    <meta property="og:title" content="WebHub Showcase" />
    <meta property="og:description" content="Nền tảng chia sẻ website và mô phỏng giáo dục trực tuyến với mã QR, chế độ xem rút gọn và phân loại mô phỏng nổi tiếng." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="initial-loading-container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0f172a; padding: 24px; box-sizing: border-box;">
        <style>
          @keyframes app-spin {
            to { transform: rotate(360deg); }
          }
          @keyframes app-fade-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
          }
          .app-loader-spinner {
            width: 36px;
            height: 36px;
            border: 3.5px solid rgba(99, 102, 241, 0.15);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: app-spin 0.8s linear infinite;
          }
          .app-loader-text {
            animation: app-fade-pulse 1.8s ease-in-out infinite;
          }
          @media (prefers-reduced-motion: reduce) {
            .app-loader-spinner {
              animation: none;
              border-top-color: #6366f1;
            }
            .app-loader-text {
              animation: none;
            }
          }
        </style>
        <div style="display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 340px;">
          <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3); margin-bottom: 16px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          <h1 style="margin: 0 0 8px 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #0f172a;">WebHub Showcase</h1>
          <div class="app-loader-spinner" style="margin: 18px 0 14px 0;" role="progressbar" aria-label="Loading"></div>
          <p class="app-loader-text" style="margin: 0; font-size: 13px; font-weight: 600; color: #64748b; letter-spacing: 0.01em;">Đang khởi tạo ứng dụng...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
