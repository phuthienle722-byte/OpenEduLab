        });

        // ==========================================
        // 1. CHÂN ĐẾ GANG & 4 CHÂN CAO SU (y = 0.000m -> 0.022m)
        // ==========================================
        var baseGroup = new THREE.Group();
        baseGroup.name = 'body';
        group.add(baseGroup);

        // Chân đế chính: 140 x 20 x 120 mm đặt tại y = 0.012 (đáy tại y = 0.002)
        var plinth = new THREE.Mesh(
          new THREE.BoxGeometry(0.140, 0.020, 0.120),
          baseMat
        );
        plinth.position.set(0, 0.012, 0);
        plinth.castShadow = true;
        plinth.receiveShadow = true;
        baseGroup.add(plinth);

        // 4 chân cao su ở 4 góc: chạm mặt bàn đúng y = 0.000m!
        var footGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.004, 16);
        var footCoords = [
          [-0.055, 0.002, -0.045],
          [ 0.055, 0.002, -0.045],
          [-0.055, 0.002,  0.045],
          [ 0.055, 0.002,  0.045]
        ];
        footCoords.forEach(function(c) {
          var foot = new THREE.Mesh(footGeo, rubberFootMat);
          foot.position.set(c[0], c[1], c[2]);
          baseGroup.add(foot);
        });

        // Ốc ren siết giữ cột trụ trên mặt đế
        var collar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.014, 0.018, 0.010, 20),
          brassMat
        );
        collar.position.set(0, 0.027, 0);
        baseGroup.add(collar);

        // ==========================================
        // 2. CỘT TRỤ ĐỨNG INOX (Chiều cao 340mm)
        // ==========================================
        var mast = new THREE.Mesh(
          new THREE.CylinderGeometry(0.006, 0.006, 0.330, 24),
          stainlessMat
        );
        mast.position.set(0, 0.192, 0); // y_bottom = 0.027, y_top = 0.357
        mast.castShadow = true;
        baseGroup.add(mast);

        // ==========================================
        // 3. Ổ TRỤC QUAY & ĐĨA ĐỘ (-30° đến +30°) TẠI y = 0.320m
        // ==========================================
        var pivotY = 0.320;
        var pivotHub = new THREE.Mesh(
          new THREE.CylinderGeometry(0.015, 0.015, 0.028, 24),
          stainlessMat
        );
        pivotHub.rotation.x = Math.PI / 2;
        pivotHub.position.set(0, pivotY, 0);
        baseGroup.add(pivotHub);

        // Đĩa chia độ dạng CanvasTexture
        function createProtractorCanvas() {
          var cv = document.createElement('canvas');
          cv.width = 512;
          cv.height = 256;
          var ctx = cv.getContext('2d');
          if (ctx) {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, 512, 256);

            // Vành bán nguyệt
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(256, 40, 190, 0, Math.PI);
            ctx.stroke();

            // Vạch độ chia từ -30° đến +30°
            for (var deg = -30; deg <= 30; deg += 5) {
              var rad = (deg + 90) * Math.PI / 180;
              var isMajor = (deg % 10 === 0);
              var isZero = (deg === 0);
              var rInner = isMajor ? 150 : 168;
              var rOuter = 190;
              var x1 = 256 + Math.cos(rad) * rInner;
              var y1 = 40 + Math.sin(rad) * rInner;
              var x2 = 256 + Math.cos(rad) * rOuter;
              var y2 = 40 + Math.sin(rad) * rOuter;

              ctx.strokeStyle = isZero ? '#22c55e' : (isMajor ? '#facc15' : '#94a3b8');
              ctx.lineWidth = isZero ? 6 : (isMajor ? 3 : 1.5);
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();

              if (isMajor) {
                ctx.fillStyle = isZero ? '#4ade80' : '#e2e8f0';
                ctx.font = 'bold 22px monospace';
                ctx.textAlign = 'center';
                var tx = 256 + Math.cos(rad) * 125;
                var ty = 40 + Math.sin(rad) * 125 + 8;
                ctx.fillText((deg > 0 ? '+' : '') + deg + '°', tx, ty);
              }
            }

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ĐÒN BẨY THĂNG BẰNG · KHTN 8', 256, 235);
          }
          var tex = new THREE.CanvasTexture(cv);
          tex.needsUpdate = true;
          return { canvas: cv, texture: tex };
        }

        var protractorData = createProtractorCanvas();
        var protractorMat = new THREE.MeshBasicMaterial({
          map: protractorData.texture,
          transparent: true,
          side: THREE.DoubleSide
        });

        // Mặt đĩa trước (+Z)
        var frontDial = new THREE.Mesh(new THREE.PlaneGeometry(0.120, 0.060), protractorMat);
        frontDial.name = 'scale_display';
        frontDial.position.set(0, pivotY - 0.030, 0.016);
        group.add(frontDial);

        // Mặt đĩa sau (-Z) đồng bộ 360°
        var rearDial = new THREE.Mesh(new THREE.PlaneGeometry(0.120, 0.060), protractorMat);
        rearDial.name = 'scale_display_rear';
        rearDial.position.set(0, pivotY - 0.030, -0.016);
        rearDial.rotation.y = Math.PI;
        group.add(rearDial);

        // ==========================================
        // 4. THANH ĐÒN BẨY XOAY QUANH TRỤC Z ('plunger')
        // ==========================================
        var leverGroup = new THREE.Group();
        leverGroup.name = 'plunger';
        leverGroup.position.set(0, pivotY, 0);
        group.add(leverGroup);

        // Thanh nhôm 400 x 18 x 4 mm
        var beam = new THREE.Mesh(
          new THREE.BoxGeometry(0.400, 0.018, 0.004),
          aluminumMat
        );
        beam.castShadow = true;
        leverGroup.add(beam);

        // Kim chỉ thị thăng bằng chỉ thẳng xuống đĩa chia độ
        var needle = new THREE.Mesh(
          new THREE.CylinderGeometry(0.0012, 0.002, 0.055, 12),
          new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 })
        );
        needle.position.set(0, -0.030, 0.0035);
        leverGroup.add(needle);

        // 18 Lỗ treo chia đều 2 bên (bước 20 mm, từ x = ±0.020m đến ±0.180m)
        var holeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
        var holeRingGeo = new THREE.CylinderGeometry(0.0022, 0.0022, 0.0044, 16);
        for (var k = 1; k <= 9; k++) {
          var xDist = k * 0.020;
          // Lỗ bên trái
          var hLeft = new THREE.Mesh(holeRingGeo, holeMat);
          hLeft.rotation.x = Math.PI / 2;
          hLeft.position.set(-xDist, 0, 0);
          leverGroup.add(hLeft);
          // Lỗ bên phải
          var hRight = new THREE.Mesh(holeRingGeo, holeMat);
          hRight.rotation.x = Math.PI / 2;
          hRight.position.set(xDist, 0, 0);
          leverGroup.add(hRight);
        }

        // Đai ốc vi chỉnh đối trọng ren M4 bằng đồng thau ở 2 đầu (x = ±0.195m)
        var studGeo = new THREE.CylinderGeometry(0.002, 0.002, 0.025, 12);
        var nutGeo = new THREE.CylinderGeometry(0.006, 0.006, 0.010, 16);

        // Đầu trái
        var studL = new THREE.Mesh(studGeo, stainlessMat);
        studL.rotation.z = Math.PI / 2;
        studL.position.set(-0.200, 0, 0);
        leverGroup.add(studL);
        var nutL = new THREE.Mesh(nutGeo, brassMat);
        nutL.rotation.z = Math.PI / 2;
        nutL.position.set(-0.198, 0, 0);
        leverGroup.add(nutL);

        // Đầu phải
        var studR = new THREE.Mesh(studGeo, stainlessMat);
        studR.rotation.z = Math.PI / 2;
        studR.position.set(0.200, 0, 0);
        leverGroup.add(studR);
        var nutR = new THREE.Mesh(nutGeo, brassMat);
        nutR.rotation.z = Math.PI / 2;
        nutR.position.set(0.198, 0, 0);
        leverGroup.add(nutR);

        // Quả cân mẫu 50g treo tại lỗ số 4 bên trái (x = -0.080m)
        var hangerWireL = new THREE.Mesh(
          new THREE.CylinderGeometry(0.0008, 0.0008, 0.035, 8),
          stainlessMat
        );
        hangerWireL.position.set(-0.080, -0.020, 0);
        leverGroup.add(hangerWireL);

        var weightL = new THREE.Mesh(
          new THREE.CylinderGeometry(0.010, 0.010, 0.024, 20),
          weightMat
        );
        weightL.position.set(-0.080, -0.045, 0);
        leverGroup.add(weightL);

        // 2 Quả cân mẫu 50g treo tại lỗ số 2 bên phải (x = +0.040m) -> F1.d1 = 1*4 = F2.d2 = 2*2 = 4 (Thăng bằng!)
        var hangerWireR = new THREE.Mesh(
          new THREE.CylinderGeometry(0.0008, 0.0008, 0.035, 8),
          stainlessMat
        );
        hangerWireR.position.set(0.040, -0.020, 0);
        leverGroup.add(hangerWireR);

        var weightR1 = new THREE.Mesh(
          new THREE.CylinderGeometry(0.010, 0.010, 0.024, 20),
          weightMat
        );
        weightR1.position.set(0.040, -0.045, 0);
        leverGroup.add(weightR1);

        var weightR2 = new THREE.Mesh(
          new THREE.CylinderGeometry(0.010, 0.010, 0.024, 20),
          weightMat
        );
        weightR2.position.set(0.040, -0.070, 0);
        leverGroup.add(weightR2);

        // Chốt trục quay trung tâm màu đỏ
        var centerCap = new THREE.Mesh(
          new THREE.CylinderGeometry(0.007, 0.007, 0.012, 20),
          new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2 })
        );
        centerCap.rotation.x = Math.PI / 2;
        centerCap.position.set(0, 0, 0.006);
        leverGroup.add(centerCap);

        group.userData = {
          leverGroup: leverGroup,
          needle: needle,
          lastDeg: 0,
          protractorData: protractorData
        };

        return group;
      },

      updateEquipmentState: function(rootObject, state, dt) {
        var deg = 0;
        if (state && typeof state.incidentAngleDeg === 'number') {
          deg = state.incidentAngleDeg;
        } else if (state && typeof state.multimeterValue === 'number') {
          deg = state.multimeterValue;
        }

        // Giới hạn trong phạm vi cơ học cữ chặn [-30°, +30°]
        deg = Math.max(-30, Math.min(30, deg));

        var lever = rootObject.getObjectByName('plunger');
        if (lever) {
          // Quay thanh quanh trục Z theo góc âm/dương
          var targetRad = (deg * Math.PI) / 180;
          lever.rotation.z = -targetRad;
        }

        if (rootObject.userData && rootObject.userData.lastDeg !== deg) {
          rootObject.userData.lastDeg = deg;
        }
      },

      playEquipmentSound: function(eventType, value) {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!window.__ol3dAudioCtx) window.__ol3dAudioCtx = new AudioCtx();
          var ctx = window.__ol3dAudioCtx;
          if (ctx.state === 'suspended') ctx.resume();
          var now = ctx.currentTime;
          var deg = typeof value === 'number' ? value : 0;

          // Tiếng va chạm nhẹ khi chạm cữ hãm hoặc đạt điểm thăng bằng 0°
          var osc = ctx.createOscillator();
          var gain = ctx.createGain();
          osc.type = 'triangle';

          if (Math.abs(deg) < 0.5) {
            // Âm ngân cao êm dịu khi đạt thăng bằng chuẩn
            osc.frequency.setValueAtTime(660, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.12);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          } else {
            // Âm 'clack' cơ học khi dịch chuyển góc
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(140, now + 0.05);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          }

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } catch (e) {
          // Audio fallback safe
        }
      },

      // Cầu nối tương thích ngược v2.2
      buildEquipmentGroup: function(THREE, asset) {
        return this.buildEquipmentMesh(THREE, asset);
      },
      applyEquipmentState: function(THREE, rootObject, instance, asset) {
        var st = instance && instance.instanceState ? instance.instanceState : {};
        this.updateEquipmentState(rootObject, st, 0.016);
      }
    };
  </script>
