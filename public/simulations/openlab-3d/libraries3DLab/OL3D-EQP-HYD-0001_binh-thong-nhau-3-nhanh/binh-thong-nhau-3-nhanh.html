  <!-- 4. MÃ DỰNG MÔ HÌNH 3D THREE.JS CHUẨN MASTER SPEC v2.4 -->
  <script id="ol3d-module-3d-script">
    window.OL3D_EQUIPMENT_MODULE = {
      buildEquipmentMesh: function(THREE, asset) {
        var group = new THREE.Group();
        group.name = (asset && asset.slug ? asset.slug : 'communicating_vessels') + '_root';

        // Vật liệu PBR chuẩn
        var baseMat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          roughness: 0.45,
          metalness: 0.15
        });
        var glassMat = new THREE.MeshPhysicalMaterial({
          color: 0xe0f2fe,
          transparent: true,
          opacity: 0.38,
          roughness: 0.05,
          transmission: 0.88,
          ior: 1.50,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        var waterMat = new THREE.MeshPhysicalMaterial({
          color: 0x0284c7,
          emissive: 0x0369a1,
          emissiveIntensity: 0.22,
          roughness: 0.08,
          ior: 1.333,
          clearcoat: 1.0,
          transparent: true,
          opacity: 0.82,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        // ==========================================
        // 1. CHÂN ĐẾ NHỰA CHỐNG LẬT (y = 0.000m -> 0.020m)
        // ==========================================
        var baseGroup = new THREE.Group();
        baseGroup.name = 'body';
        group.add(baseGroup);

        // Chân đế 160 x 20 x 55 mm đặt tại y = 0.010m (chạm đáy đúng y = 0.000m!)
        var plinth = new THREE.Mesh(
          new THREE.BoxGeometry(0.160, 0.020, 0.055),
          baseMat
        );
        plinth.position.set(0, 0.010, 0);
        plinth.castShadow = true;
        plinth.receiveShadow = true;
        baseGroup.add(plinth);

        // Rãnh kẹp ống thủy tinh trên đế
        var slotMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.144, 0.008, 0.022),
          new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6 })
        );
        slotMesh.position.set(0, 0.020, 0);
        baseGroup.add(slotMesh);

        // ==========================================
        // 2. KHỐI THỦY TINH 3 NHÁNH BOROSILICATE
        // ==========================================
        var glassGroup = new THREE.Group();
        glassGroup.name = 'glass_manifold';
        baseGroup.add(glassGroup);

        // Ống đáy nằm ngang: dài 130mm, đường kính 14mm tại y = 0.028m
        var bottomTube = new THREE.Mesh(
          new THREE.CylinderGeometry(0.007, 0.007, 0.130, 24),
          glassMat
        );
        bottomTube.rotation.z = Math.PI / 2;
        bottomTube.position.set(0, 0.028, 0);
        glassGroup.add(bottomTube);

        // Nhánh 1 (Trái, x = -0.045m): Ống trụ thẳng Ø 12 mm, cao 150 mm
        var branch1 = new THREE.Mesh(
          new THREE.CylinderGeometry(0.006, 0.006, 0.150, 24),
          glassMat
        );
        branch1.position.set(-0.045, 0.028 + 0.075, 0);
        glassGroup.add(branch1);

        // Nhánh 2 (Giữa, x = 0.000m): Ống uốn lượn hình sóng sin
        var waveCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0.028, 0),
          new THREE.Vector3(0.010, 0.065, 0),
          new THREE.Vector3(-0.010, 0.105, 0),
          new THREE.Vector3(0.010, 0.145, 0),
          new THREE.Vector3(0, 0.178, 0)
        ]);
        var branch2 = new THREE.Mesh(
          new THREE.TubeGeometry(waveCurve, 32, 0.005, 16, false),
          glassMat
        );
        glassGroup.add(branch2);

        // Nhánh 3 (Phải, x = +0.045m): Ống phình quả trám (Ø 30 mm)
        var branch3Lower = new THREE.Mesh(
          new THREE.CylinderGeometry(0.006, 0.006, 0.050, 24),
          glassMat
        );
        branch3Lower.position.set(0.045, 0.028 + 0.025, 0);
        glassGroup.add(branch3Lower);

        var branch3Bulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.015, 24, 20),
          glassMat
        );
        branch3Bulb.position.set(0.045, 0.028 + 0.075, 0);
        glassGroup.add(branch3Bulb);

        var branch3Upper = new THREE.Mesh(
          new THREE.CylinderGeometry(0.006, 0.006, 0.050, 24),
          glassMat
        );
        branch3Upper.position.set(0.045, 0.028 + 0.125, 0);
        glassGroup.add(branch3Upper);

        // Vành mút miệng 3 ống
        var lipGeo = new THREE.TorusGeometry(0.0065, 0.0012, 12, 24);
        var lip1 = new THREE.Mesh(lipGeo, glassMat);
        lip1.rotation.x = Math.PI / 2;
        lip1.position.set(-0.045, 0.178, 0);
        glassGroup.add(lip1);

        var lip2 = new THREE.Mesh(lipGeo, glassMat);
        lip2.rotation.x = Math.PI / 2;
        lip2.position.set(0, 0.178, 0);
        glassGroup.add(lip2);

        var lip3 = new THREE.Mesh(lipGeo, glassMat);
        lip3.rotation.x = Math.PI / 2;
        lip3.position.set(0.045, 0.178, 0);
        glassGroup.add(lip3);

        // ==========================================
        // 3. KHỐI CHẤT LỎNG NƯỚC MÀU ('liquid_surface')
        // ==========================================
        var liquidGroup = new THREE.Group();
        liquidGroup.name = 'liquid_surface';
        group.add(liquidGroup);

        // Nước trong ống đáy nằm ngang (luôn đầy khi liquidLevelMl > 0)
        var waterBottomTube = new THREE.Mesh(
          new THREE.CylinderGeometry(0.0055, 0.0055, 0.128, 20),
          waterMat
        );
        waterBottomTube.rotation.z = Math.PI / 2;
        waterBottomTube.position.set(0, 0.028, 0);
        liquidGroup.add(waterBottomTube);

        // Cột nước nhánh 1 (thẳng)
        var water1 = new THREE.Mesh(
          new THREE.CylinderGeometry(0.0048, 0.0048, 0.140, 20),
          waterMat
        );
        water1.geometry.translate(0, 0.070, 0);
        water1.position.set(-0.045, 0.028, 0);
        liquidGroup.add(water1);

        // Cột nước nhánh 2 (lượn sóng)
        var water2 = new THREE.Mesh(
          new THREE.CylinderGeometry(0.0042, 0.0042, 0.140, 20),
          waterMat
        );
        water2.geometry.translate(0, 0.070, 0);
        water2.position.set(0, 0.028, 0);
        liquidGroup.add(water2);

        // Cột nước nhánh 3 (quả trám)
        var water3 = new THREE.Mesh(
          new THREE.CylinderGeometry(0.0048, 0.0048, 0.140, 20),
          waterMat
        );
        water3.geometry.translate(0, 0.070, 0);
        water3.position.set(0.045, 0.028, 0);
        liquidGroup.add(water3);

        // Khối nước phình ở bầu nhánh 3
        var waterBulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.0135, 20, 16),
          waterMat
        );
        waterBulb.position.set(0.045, 0.028 + 0.075, 0);
        liquidGroup.add(waterBulb);

        // 3 Vành mặt khum mao dẫn phản chiếu ánh sáng trên đỉnh mặt nước
        var meniscusGeo = new THREE.RingGeometry(0, 0.0052, 20);
        var meniscusMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85
        });

        var mRing1 = new THREE.Mesh(meniscusGeo, meniscusMat);
        mRing1.rotation.x = -Math.PI / 2;
        mRing1.position.set(-0.045, 0.098, 0);
        liquidGroup.add(mRing1);

        var mRing2 = new THREE.Mesh(meniscusGeo, meniscusMat);
        mRing2.rotation.x = -Math.PI / 2;
        mRing2.position.set(0, 0.098, 0);
        liquidGroup.add(mRing2);

        var mRing3 = new THREE.Mesh(meniscusGeo, meniscusMat);
        mRing3.rotation.x = -Math.PI / 2;
        mRing3.position.set(0.045, 0.098, 0);
        liquidGroup.add(mRing3);

        // Khởi tạo mức ban đầu (75 ml = 50% chiều cao)
        var initialRatio = 75 / 150;
        water1.scale.set(1, initialRatio, 1);
        water2.scale.set(1, initialRatio, 1);
        water3.scale.set(1, initialRatio, 1);
        var currentY = 0.028 + initialRatio * 0.140;
        mRing1.position.y = currentY;
        mRing2.position.y = currentY;
        mRing3.position.y = currentY;

        group.userData = {
          liquidGroup: liquidGroup,
          water1: water1,
          water2: water2,
          water3: water3,
          waterBulb: waterBulb,
          mRing1: mRing1,
          mRing2: mRing2,
          mRing3: mRing3,
          lastMl: 75
        };

        return group;
      },

      updateEquipmentState: function(rootObject, state, dt) {
        var ml = 75;
        if (state && typeof state.liquidLevelMl === 'number') {
          ml = state.liquidLevelMl;
        } else if (state && typeof state.multimeterValue === 'number') {
          ml = state.multimeterValue;
        }

        ml = Math.max(0, Math.min(150, ml));

        var lGroup = rootObject.getObjectByName('liquid_surface');
        if (!lGroup) return;

        if (ml <= 0.5) {
          lGroup.visible = false;
          return;
        }

        lGroup.visible = true;
        var ratio = Math.max(0.05, Math.min(1.0, ml / 150));

        var ud = rootObject.userData;
        if (ud) {
          if (ud.water1 && ud.water1.scale) ud.water1.scale.set(1, ratio, 1);
          if (ud.water2 && ud.water2.scale) ud.water2.scale.set(1, ratio, 1);
          if (ud.water3 && ud.water3.scale) ud.water3.scale.set(1, ratio, 1);

          var topY = 0.028 + ratio * 0.140;
          if (ud.mRing1) ud.mRing1.position.y = topY;
          if (ud.mRing2) ud.mRing2.position.y = topY;
          if (ud.mRing3) ud.mRing3.position.y = topY;

          // Bầu phình nhánh 3 chỉ hiện khi nước ngập tới cao độ bầu
          if (ud.waterBulb) {
            ud.waterBulb.visible = (ratio >= 0.45);
          }
        }
      },

      playEquipmentSound: function(eventType, value) {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!window.__ol3dAudioCtx) window.__ol3dAudioCtx = new AudioCtx();
          var ctx = window.__ol3dAudioCtx;
          if (ctx.state === 'suspended') ctx.resume();
          var now = ctx.currentTime;
          var ml = typeof value === 'number' ? value : 75;

          // Tiếng rót nước róc rách vào bình thủy tinh
          var osc1 = ctx.createOscillator();
          var osc2 = ctx.createOscillator();
          var gain = ctx.createGain();

          osc1.type = 'sine';
          osc2.type = 'triangle';

          // Tần số cao dần theo mực nước dâng
          var baseFreq = 420 + (ml / 150) * 360;
          osc1.frequency.setValueAtTime(baseFreq, now);
          osc1.frequency.exponentialRampToValueAtTime(baseFreq + 40, now + 0.12);

          osc2.frequency.setValueAtTime(baseFreq * 1.5, now);
          osc2.frequency.exponentialRampToValueAtTime(baseFreq * 1.5 - 30, now + 0.12);

          gain.gain.setValueAtTime(0.09, now);
          gain.gain.exponentialRampToValueAtTime(0.002, now + 0.14);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.15);
          osc2.stop(now + 0.15);
        } catch (e) {
          // Audio safe
        }
      },

      // Cầu nối tương thích ngược v2.2
      buildEquipmentGroup: function(THREE, asset) {
        return this.buildEquipmentMesh(THREE, asset);
      },
      applyEquipmentState: function(THREE, rootObject, instance, asset) {
        var st = instance && instance.instanceState ? instance.instanceState : {};
        this.updateEquipmentState(rootObject, st, 0.016);
      }
    };
  </script>
